<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NY Real Estate Command Center</title>
    <style>
        :root { --bg: #0a0a0a; --card: #161616; --text: #f0f0f0; --kw-red: #ED1C24; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid #333; border-radius: 8px; padding: 15px; }
        h3 { color: var(--kw-red); border-bottom: 1px solid #222; padding-bottom: 8px; margin-top: 0; }
        iframe { border: none; width: 100%; height: 350px; background: #fff; border-radius: 4px; }
        .full-width { grid-column: 1 / -1; height: 550px; }
    </style>
</head>
<body>

<div class="grid">
    <!-- MORTGAGE RATES (UNTOUCHED AS REQUESTED) -->
    <div class="card">
        <h3>National Daily Mortgage Rates</h3>
        <iframe src="https://widgets.mortgagenewsdaily.com/widget/f/rates?t=large&sn=true&c=336699&u=&cbu=&w=598&h=290" 
                style="width:100%; height:310px; background: transparent;"></iframe>
    </div>

    <!-- CHEMUNG COUNTY (MAY 2026 DATA) -->
    <div class="card">
        <h3>Chemung County: Market Hotness (2026)</h3>
        <iframe src="https://fred.stlouisfed.org/graph/graph-landing.php?g=1nl2i&width=450&height=300"></iframe>
    </div>

    <!-- STEUBEN COUNTY (MAY 2026 DATA) -->
    <div class="card">
        <h3>Steuben County: Market Hotness (2026)</h3>
        <iframe src="https://fred.stlouisfed.org/graph/graph-landing.php?g=1nl2x&width=450&height=300"></iframe>
    </div>

    <!-- 10Y TREASURY YIELD (DARK MODE CANDLESTICKS - NO REDIRECT) -->
    <div class="card full-width">
        <h3>Live 10-Year Treasury Yield</h3>
        <iframe src="https://s.tradingview.com/widgetembed/?symbol=TVC%3AUS10Y&interval=D&hidesidetoolbar=0&symboledit=0&theme=dark&style=1&timezone=Etc%2FUTC" 
                style="width: 100%; height: 500px; background: #161616;"></iframe>
    </div>
</div>

</body>
</html>
