<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY Real Estate Command Center</title>
    <style>
        :root { --kw-red: #ED1C24; --bg: #0a0a0a; --card: #161616; --text: #f0f0f0; }
        body { background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 15px; }
        .header { border-bottom: 3px solid var(--kw-red); margin-bottom: 20px; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid #333; border-radius: 8px; padding: 15px; overflow: hidden; }
        h3 { color: var(--kw-red); font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .full-width { grid-column: 1 / -1; min-height: 500px; }
        iframe { border: none; width: 100%; border-radius: 4px; background: transparent; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 1.6rem;">NY REAL ESTATE COMMAND CENTER</h1>
</div>

<div class="grid">
    <!-- LIVE MORTGAGE RATES (MND EMBED) -->
    <div class="card">
        <h3>National Daily Mortgage Rates</h3>
        <!-- Forcing the specific MND widget code you provided -->
        <div style="background-color: #161616; border-radius: 8px; padding: 5px;">
            <iframe src="https://widgets.mortgagenewsdaily.com/widget/f/rates?t=large&sn=true&c=336699&u=&cbu=&w=598&h=290" 
                    height="320" frameborder="0" scrolling="no" style="filter: invert(90%) hue-rotate(180deg);"></iframe>
        </div>
        <p style="font-size: 10px; color: #555; text-align: center;">Source: Mortgage News Daily (Live Data)</p>
    </div>

    <!-- CHEMUNG COUNTY DAYS ON MARKET (EMBEDDED) -->
    <div class="card">
        <h3>Chemung County: Median Days on Market</h3>
        <iframe border="0" scrolling="no" width="100%" height="320" 
                src="https://fred.stlouisfed.org/graph/graph-landing.php?g=1mHj0&width=450&height=300"></iframe>
    </div>

    <!-- STEUBEN COUNTY DAYS ON MARKET (EMBEDDED) -->
    <div class="card">
        <h3>Steuben County: Median Days on Market</h3>
        <iframe border="0" scrolling="no" width="100%" height="320" 
                src="https://fred.stlouisfed.org/graph/graph-landing.php?g=1mHjg&width=450&height=300"></iframe>
    </div>

    <!-- SCHUYLER COUNTY DAYS ON MARKET (EMBEDDED) -->
    <div class="card">
        <h3>Schuyler County: Median Days on Market</h3>
        <iframe border="0" scrolling="no" width="100%" height="320" 
                src="https://fred.stlouisfed.org/graph/graph-landing.php?g=1mHjn&width=450&height=300"></iframe>
    </div>

    <!-- MAIN 10Y TREASURY YIELD CHART (DARK MODE / CANDLESTICKS) -->
    <div class="card full-width">
        <h3>Live 10-Year Treasury Yield (Candlesticks)</h3>
        <div id="tradingview_10y" style="height: 500px;"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
          new TradingView.widget({
            "width": "100%",
            "height": 500,
            "symbol": "TVC:US10Y",
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1", // Candlesticks
            "locale": "en",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_10y",
            "support_host": "https://www.tradingview.com" // Crucial for local file stability
          });
        </script>
    </div>
</div>

</body>
</html>
