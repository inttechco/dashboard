<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NY Real Estate Command Center</title>
    <style>
        :root { --kw-red: #ED1C24; --bg: #0a0a0a; --card: #161616; --text: #f0f0f0; }
        body { background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 15px; }
        .header { border-bottom: 3px solid var(--kw-red); margin-bottom: 20px; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid #333; border-radius: 8px; padding: 15px; overflow: hidden; }
        h3 { color: var(--kw-red); font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 1px solid #222; padding-bottom: 8px; }
        .full-width { grid-column: 1 / -1; min-height: 450px; }
        iframe { border: none; width: 100%; border-radius: 4px; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 1.6rem;">NY REAL ESTATE COMMAND CENTER</h1>
</div>

<div class="grid">
    <!-- NATIONAL RATES (UNTOUCHED PER REQUEST) -->
    <div class="card">
        <h3>National Daily Mortgage Rates</h3>
        <div class="mnd-rates-widget" style="width: 600px; height: 340px; font-size: 12px; ">
            <div class="w-header" style="text-align: center; padding:4px 0;background-color: #336699; color: #FFFFFF;"> <a href="https://www.mortgagenewsdaily.com/mortgage-rates" target="_blank" style="color: #FFFFFF;text-decoration:none;">Home Mortgage Rates</a></div>
            <iframe src="//widgets.mortgagenewsdaily.com/widget/f/rates?t=large&sn=true&c=336699&u=&cbu=&w=598&h=290" width="600" height="290" frameborder="0" scrolling="no" style="border: solid 1px #336699; border-width: 0 1px;box-sizing:border-box;width:600px;height:290px;display:block;"></iframe>
            <div class="w-footer" style="text-align: center; padding:4px 0;background-color: #336699; color: #FFFFFF;">View More <a href="https://www.mortgagenewsdaily.com/mortgage-rates" target="_blank" style="color: #FFFFFF;text-decoration:none;">Interest Rates</a></div>
        </div>
    </div>

    <!-- CHEMUNG COUNTY (2026 DATA) -->
    <div class="card">
        <h3>Chemung County: Median Days on Market</h3>
        <iframe src="https://fred.stlouisfed.org/graph/graph-landing.php?g=1mIal&width=450&height=300" 
                scrolling="no" width="100%" height="320"></iframe>
    </div>

    <!-- STEUBEN COUNTY (2026 DATA) -->
    <div class="card">
        <h3>Steuben County: Median Days on Market</h3>
        <iframe src="https://fred.stlouisfed.org/graph/graph-landing.php?g=1mIaE&width=450&height=300" 
                scrolling="no" width="100%" height="320"></iframe>
    </div>

    <!-- SCHUYLER COUNTY (2026 DATA) -->
    <div class="card">
        <h3>Schuyler County: Median Days on Market</h3>
        <iframe src="https://fred.stlouisfed.org/graph/graph-landing.php?g=1mIaN&width=450&height=300" 
                scrolling="no" width="100%" height="320"></iframe>
    </div>

    <!-- TREASURY YIELD CHART (STABLE MINI-WIDGET) -->
    <div class="card full-width">
        <h3>Live 10-Year Treasury Yield (Candlesticks)</h3>
        <div class="tradingview-widget-container" style="width: 100%; height: 400px;">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
            {
              "symbol": "TVC:US10Y",
              "width": "100%",
              "height": "100%",
              "locale": "en",
              "dateRange": "1M",
              "colorTheme": "dark",
              "isTransparent": true,
              "autosize": true,
              "largeChartUrl": ""
            }
            </script>
        </div>
    </div>
</div>

</body>
</html>
